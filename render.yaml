# Render Blueprint – New → Blueprint → pick this repo.
services:
  - type: web
    name: smart-review-agent
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Address printed in every QR code and review link. review.haemoglobbinn.com has no DNS record yet,
      # so use the Render address until the custom domain is connected (README 6C), then change both.
      - key: PUBLIC_SITE_URL
        value: https://smart-review-agent.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://smart-review-agent.onrender.com
